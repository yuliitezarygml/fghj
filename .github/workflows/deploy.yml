name: Deploy

on:
  push:
    branches:
      - main
      - Dev

concurrency:
  group: deploy-full
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_WAIT_TIMEOUT: "600"
      NODE_IMAGE: "node:22-alpine"
    steps:
     
      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

